name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dom:
    name: Card behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  browser:
    name: Card browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install playwright==1.63.0
      - run: playwright install --with-deps chromium
      - run: python tests/test_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-screenshots
          path: artifacts/
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
